# Release Workflow
#
# Entry point for all npm publishing of @nexusmutual/deployments. Handles both
# the production (@latest) and release-candidate (@next) channels through a
# single workflow, because npm trusted publishing authorises one workflow file
# rather than a repository.
#
# Triggered manually. Pick the channel when dispatching:
# - next   builds an RC from release-candidate and publishes it under '@next'.
#          Commits nothing.
# - latest commits the version bump to release-candidate, fast-forwards master,
#          tags, and publishes under '@latest'.
#
# Publishing uses OIDC, so no npm token is stored here. The package is
# registered on npm with this repository and this workflow file as its trusted
# publisher; renaming the file breaks publishing until npm is updated to match.

name: Release

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Which npm tag to publish"
        type: choice
        options:
          - next
          - latest
        default: next

permissions:
  contents: read

# Both channels publish the same package and derive versions from the same
# tags, so they must not run concurrently.
concurrency:
  group: release
  cancel-in-progress: false

env:
  NODE_VERSION: 22

jobs:
  prep-next:
    if: inputs.channel == 'next'
    uses: ./.github/workflows/prep-next.yml
    secrets: inherit

  prep-latest:
    if: inputs.channel == 'latest'
    uses: ./.github/workflows/prep-latest.yml
    secrets: inherit

  publish:
    needs: [prep-next, prep-latest]
    # Only one prep job runs and the other is skipped, so the run is judged on
    # whichever produced an artifact.
    if: >-
      always() &&
      ((needs.prep-next.result == 'success' && needs.prep-next.outputs.artifact_name != '') ||
       (needs.prep-latest.result == 'success' && needs.prep-latest.outputs.artifact_name != ''))
    runs-on: ubuntu-latest
    environment: production
    permissions:
      # Required for npm trusted publishing. This is what replaces NPM_TOKEN.
      id-token: write
      contents: read
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: "https://registry.npmjs.org"

      # Node 22 ships npm 10, which predates trusted publishing.
      - name: Upgrade npm
        run: npm install -g npm@^11.5.1

      # The package was built in the prep job, so publishing the artifact means
      # the built tree is what reaches npm.
      - name: Download deployments package
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.prep-next.outputs.artifact_name || needs.prep-latest.outputs.artifact_name }}
          path: package

      - name: Publish
        working-directory: package
        run: npm publish --tag ${{ inputs.channel }} --access public --ignore-scripts
